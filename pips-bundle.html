<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142939">
  <title>Pips — Journal XAUUSD</title>
  <style>
/* css/styles.css */
:root {
  --navy:   #17212b;
  --gold:   #c8a96e;
  --ink:    #1f2d3a;
  --muted:  #6b7f8e;
  --bg:     #eef2f5;
  --line:   #dde4ea;
  --green:  #2d8f6f;
  --red:    #c0444f;
  --white:  #ffffff;
  --sidebar-w: 248px;
  --radius: 14px;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.55 'Inter', 'Avenir Next', Avenir, 'Segoe UI', sans-serif;
}

button, input, select, textarea { font: inherit; }
button { cursor: pointer; border: none; background: none; }
button:disabled { opacity: .4; cursor: not-allowed; }
a { color: inherit; text-decoration: none; }
[hidden] { display: none !important; }

/* ── Layout ─────────────────────────────────────────── */

.layout {
  display: flex;
  min-height: 100vh;
}

/* ── Sidebar ─────────────────────────────────────────── */

.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: var(--sidebar-w);
  background: var(--navy);
  color: #aec0cc;
  padding: 32px 18px 28px;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}

.brand {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -1.5px;
  color: #fff;
  margin-bottom: 32px;
  display: flex;
  align-items: baseline;
  gap: 1px;
  cursor: pointer;
}

.brand-dot { color: var(--gold); }
.brand:hover .brand-dot { opacity: .75; }

.sidebar-label {
  font-size: 11px;
  letter-spacing: .7px;
  color: #6b8699;
  margin-bottom: 10px;
  text-transform: uppercase;
  font-weight: 600;
}

.account-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1;
}

.account-btn {
  width: 100%;
  text-align: left;
  padding: 11px 12px;
  border-radius: 10px;
  color: #8ea4b3;
  transition: background .15s, color .15s;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.account-btn:hover { background: #1f2f3c; color: #cad8e2; }

.account-btn.active {
  background: #243444;
  color: #fff;
}

.account-btn .acc-name { font-size: 14px; font-weight: 600; }
.account-btn .acc-pips { font-size: 12px; }
.account-btn.active .acc-pips { color: var(--gold); }

.btn-add-account {
  width: 100%;
  text-align: center;
  padding: 9px;
  border: 1.5px dashed #2e4155;
  border-radius: 10px;
  font-size: 13px;
  color: #6b8699;
  margin-top: 6px;
  transition: border-color .15s, color .15s;
  cursor: pointer;
}

.btn-add-account:hover { border-color: var(--gold); color: var(--gold); }

.sidebar-total {
  margin-top: auto;
  border-top: 1px solid #243444;
  padding-top: 18px;
}

.total-btn {
  width: 100%;
  text-align: left;
  padding: 11px 12px;
  border-radius: 10px;
  color: #8ea4b3;
  transition: background .15s;
  display: flex;
  flex-direction: column;
  gap: 4px;
  cursor: pointer;
}

.total-btn:hover { background: #1f2f3c; }
.total-btn.active { background: #243444; }

.total-label { font-size: 11px; color: #6b8699; letter-spacing: .5px; text-transform: uppercase; font-weight: 600; }

.total-value {
  font-size: 26px;
  font-weight: 800;
  color: var(--gold);
  letter-spacing: -1px;
  line-height: 1.1;
}

.total-sub { font-size: 11px; color: #6b8699; }

/* ── Main ─────────────────────────────────────────── */

.main {
  margin-left: var(--sidebar-w);
  flex: 1;
  padding: 36px 40px 56px;
  max-width: 1140px;
}

/* ── Empty state ─────────────────────────────────── */

.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 60vh;
  gap: 12px;
  color: var(--muted);
  text-align: center;
}

.empty-state .icon { font-size: 40px; color: #97aab7; }
.empty-state strong { font-size: 17px; color: var(--ink); font-weight: 600; }
.empty-state p { font-size: 14px; margin: 0; }

/* ── Account header ──────────────────────────────── */

.account-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 28px;
}

.account-header h1 {
  font-size: 30px;
  font-weight: 800;
  letter-spacing: -1px;
  margin: 0 0 4px;
  color: var(--navy);
}

.account-meta { font-size: 13px; color: var(--muted); }

.header-actions { display: flex; gap: 10px; align-items: center; }

/* ── Buttons ─────────────────────────────────────── */

.btn-primary {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--navy); color: #fff;
  border-radius: 10px; padding: 10px 18px;
  font-size: 14px; font-weight: 600;
  transition: background .15s;
  cursor: pointer;
}
.btn-primary:hover { background: #263d50; }

.btn-secondary {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--white); color: var(--ink);
  border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 18px;
  font-size: 14px; font-weight: 600;
  transition: border-color .15s, background .15s;
  cursor: pointer;
}
.btn-secondary:hover { border-color: #bcc8d0; background: #f6f9fb; }

.btn-danger {
  display: inline-flex; align-items: center;
  background: none; color: var(--red);
  font-size: 14px; padding: 10px 4px;
  transition: opacity .15s;
  cursor: pointer;
}
.btn-danger:hover { opacity: .7; }

/* ── Stats cards ──────────────────────────────────── */

.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin-bottom: 24px;
}

.stat-card {
  background: var(--white);
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  padding: 20px 22px;
  box-shadow: 0 1px 4px #1721280a;
}

.stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; font-weight: 600; margin-bottom: 8px; }
.stat-value { font-size: 34px; font-weight: 800; letter-spacing: -1.5px; line-height: 1.1; }
.stat-value.pos { color: var(--green); }
.stat-value.neg { color: var(--red); }
.stat-value.neutral { color: var(--navy); }
.stat-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

/* ── Chart card ──────────────────────────────────── */

.chart-card {
  background: var(--white);
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  padding: 20px 22px;
  margin-bottom: 24px;
  box-shadow: 0 1px 4px #1721280a;
}

.chart-card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}

.chart-card-title { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
.chart-dates { font-size: 11px; color: var(--muted); }

.chart-container { height: 200px; }

/* ── Trade list ──────────────────────────────────── */

.trades-panel {
  background: var(--white);
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: 0 1px 4px #1721280a;
}

.trades-panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 22px;
  border-bottom: 1px solid var(--line);
}

.trades-panel-title { font-size: 14px; font-weight: 700; color: var(--ink); }

.trade-row {
  border-bottom: 1px solid var(--line);
  transition: background .1s;
}
.trade-row:last-child { border-bottom: none; }
.trade-row:hover { background: #f7fafc; }

.trade-main {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 22px;
}

.direction-badge {
  font-size: 11px;
  font-weight: 700;
  padding: 4px 9px;
  border-radius: 6px;
  flex-shrink: 0;
  letter-spacing: .3px;
}
.direction-badge.buy  { background: #e4f5ee; color: #2d8f6f; }
.direction-badge.sell { background: #fceef0; color: #c0444f; }

.trade-date { font-size: 13px; color: var(--muted); flex: 1; }
.trade-qty  { font-size: 12px; color: var(--muted); min-width: 64px; }

.trade-pips {
  font-size: 15px;
  font-weight: 700;
  min-width: 86px;
  text-align: right;
}
.trade-pips.pos { color: var(--green); }
.trade-pips.neg { color: var(--red); }

.btn-note {
  font-size: 12px;
  color: var(--muted);
  padding: 5px 10px;
  border-radius: 7px;
  transition: background .1s, color .1s;
  flex-shrink: 0;
  cursor: pointer;
}
.btn-note:hover { background: var(--bg); color: var(--ink); }
.btn-note.has-note { color: var(--gold); }

/* ── Inline note form ─────────────────────────────── */

.note-area {
  overflow: hidden;
  max-height: 0;
  transition: max-height .2s ease, opacity .2s ease;
  opacity: 0;
}

.note-area.open {
  max-height: 220px;
  opacity: 1;
}

.note-inner {
  padding: 14px 22px 16px;
  background: #f7fafc;
  border-top: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.note-row { display: flex; gap: 12px; align-items: flex-start; }

.emotion-select {
  flex-shrink: 0;
  border: 1.5px solid var(--line);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 13px;
  background: var(--white);
  color: var(--ink);
  width: 150px;
}

.note-textarea {
  flex: 1;
  border: 1.5px solid var(--line);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 13px;
  background: var(--white);
  color: var(--ink);
  resize: none;
  height: 68px;
  line-height: 1.5;
}

.note-textarea:focus, .emotion-select:focus {
  outline: none;
  border-color: #94aab8;
}

.note-save-btn {
  align-self: flex-end;
  font-size: 13px;
  font-weight: 600;
  color: var(--navy);
  padding: 7px 14px;
  border: 1.5px solid var(--line);
  border-radius: 8px;
  background: var(--white);
  transition: background .1s;
  cursor: pointer;
}
.note-save-btn:hover { background: var(--bg); }

/* ── Toast ───────────────────────────────────────── */

#toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--navy);
  color: #fff;
  padding: 14px 24px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 500;
  box-shadow: 0 6px 28px #0003;
  z-index: 100;
  transition: opacity .2s;
}

/* ── Dialog ──────────────────────────────────────── */

dialog {
  border: 1.5px solid var(--line);
  border-radius: 16px;
  padding: 28px;
  width: min(440px, calc(100% - 24px));
  color: var(--ink);
  box-shadow: 0 20px 80px #10263430;
}

dialog::backdrop { background: #0b233778; backdrop-filter: blur(3px); }

.dialog-title { font-size: 18px; font-weight: 700; margin: 0 0 18px; }

.dialog-input {
  width: 100%;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 15px;
  color: var(--ink);
  margin-bottom: 18px;
}

.dialog-input:focus { outline: none; border-color: #94aab8; }

.dialog-actions { display: flex; justify-content: flex-end; gap: 10px; }

/* ── Dashboard ───────────────────────────────────── */

.dash-section-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .6px;
  margin: 0 0 12px;
}

.accounts-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 14px;
  margin-bottom: 24px;
}

.account-card {
  background: var(--white);
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  padding: 20px 22px;
  cursor: pointer;
  transition: border-color .15s, box-shadow .15s;
  box-shadow: 0 1px 4px #1721280a;
}

.account-card:hover {
  border-color: #94aab8;
  box-shadow: 0 4px 16px #17212812;
}

.account-card-name {
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-bottom: 10px;
}

.account-card-pips {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -1.5px;
  line-height: 1.1;
  margin-bottom: 5px;
}

.account-card-sub { font-size: 12px; color: var(--muted); }

/* ── Filter tabs ─────────────────────────────────── */

.filter-tabs {
  display: flex;
  gap: 3px;
  background: var(--bg);
  border-radius: 10px;
  padding: 4px;
}

.filter-tab {
  font-size: 13px;
  font-weight: 600;
  padding: 6px 14px;
  border-radius: 7px;
  color: var(--muted);
  cursor: pointer;
  transition: background .12s, color .12s;
}

.filter-tab.active {
  background: var(--white);
  color: var(--navy);
  box-shadow: 0 1px 4px #0002;
}

.filter-tab:hover:not(.active) { color: var(--ink); }

/* ── Monthly breakdown ───────────────────────────── */

.monthly-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 22px;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
}

.monthly-row:last-child { border-bottom: none; }
.monthly-label { flex: 1; color: var(--muted); text-transform: capitalize; font-weight: 500; }
.monthly-count { font-size: 12px; color: var(--muted); min-width: 68px; text-align: right; }
.monthly-pips { font-weight: 700; min-width: 96px; text-align: right; font-size: 15px; }

/* ── Sidebar backup ──────────────────────────────── */

.sidebar-backup {
  display: flex;
  gap: 7px;
  margin-top: 12px;
}

.sidebar-backup button,
.sidebar-backup label {
  flex: 1;
  text-align: center;
  font-size: 12px;
  color: #6b8699;
  padding: 7px 4px;
  border: 1.5px solid #2e4155;
  border-radius: 8px;
  cursor: pointer;
  transition: border-color .15s, color .15s;
  background: none;
}

.sidebar-backup button:hover,
.sidebar-backup label:hover { border-color: var(--gold); color: var(--gold); }

/* ── Print / PDF ─────────────────────────────────── */

@media print {
  .sidebar,
  #toast,
  dialog,
  .btn-print,
  #btn-import-csv,
  #btn-import-pdf,
  #btn-rename,
  #btn-delete,
  #btn-add-account,
  #file-input-csv,
  #file-input-pdf,
  .btn-note,
  .note-area { display: none !important; }

  body { background: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  .layout { display: block !important; }

  .main {
    margin-left: 0 !important;
    max-width: 100% !important;
    padding: 24px !important;
    display: block !important;
  }

  .stats-grid { display: grid !important; }

  .stat-card { break-inside: avoid; }
  .chart-card { break-inside: avoid; }

  .trades-panel {
    overflow: visible !important;
    border-radius: 0 !important;
    border: 1px solid #ccc !important;
  }

  .trade-row { border-bottom: 1px solid #e1e8ed !important; }
  .trade-row:hover { background: none !important; }

  .trade-pips.pos { color: #2d8f6f !important; }
  .trade-pips.neg { color: #c0444f !important; }
  .direction-badge.buy  { background: #e4f5ee !important; color: #2d8f6f !important; }
  .direction-badge.sell { background: #fceef0 !important; color: #c0444f !important; }
}

<script>
// ── storage.js ────────────────────────────────────────
const KEY = 'pips-xau-v1';

function loadState() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return { version: 1, accounts: [] };
    const state = JSON.parse(raw);
    if (state.version !== 1 || !Array.isArray(state.accounts)) {
      return { version: 1, accounts: [] };
    }
    return state;
  } catch {
    return { version: 1, accounts: [] };
  }
}

function saveState(state) {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch (e) {
    throw new Error('Impossible d\'enregistrer : stockage plein ou inaccessible.');
  }
}

function createAccount(name) {
  const state = loadState();
  const account = { id: crypto.randomUUID(), name: name.trim(), trades: [] };
  state.accounts.push(account);
  saveState(state);
  return account;
}

function renameAccount(id, name) {
  const state = loadState();
  const account = state.accounts.find(a => a.id === id);
  if (!account) return false;
  account.name = name.trim();
  saveState(state);
  return true;
}

function deleteAccount(id) {
  const state = loadState();
  const before = state.accounts.length;
  state.accounts = state.accounts.filter(a => a.id !== id);
  saveState(state);
  return state.accounts.length < before;
}

function addTrades(accountId, trades) {
  const state = loadState();
  const account = state.accounts.find(a => a.id === accountId);
  if (!account) return { added: 0, skipped: 0 };
  const existing = new Set(account.trades.map(t => t.key));
  const newTrades = trades.filter(t => !existing.has(t.key));
  account.trades.push(...newTrades);
  saveState(state);
  return { added: newTrades.length, skipped: trades.length - newTrades.length };
}

function saveNote(accountId, tradeKey, note) {
  const state = loadState();
  const account = state.accounts.find(a => a.id === accountId);
  if (!account) return false;
  const trade = account.trades.find(t => t.key === tradeKey);
  if (!trade) return false;
  trade.note = note;
  saveState(state);
  return true;
}

// ── csv.js ────────────────────────────────────────────
const MONTHS = {
  // English
  Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5,
  Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11,
  // French CSV (no accents)
  Avr: 3, Mai: 4, Juin: 5, Juil: 6, Jui: 6, Aou: 7, Fev: 1,
  // French PDF (with accents)
  'Fév': 1, 'Avr': 3, 'Aoû': 7, 'Déc': 11, 'Janv': 0
};

function parseCTraderDate(str) {
  // Format: "30 Oct 2026 08:57:37.770" or "30 Avr 2026 08:57:37.770"
  const m = str.match(/^(\d+)\s+([A-Za-z\u00C0-\u024F]+)\s+(\d+)\s+(\d+):(\d+):(\d+)\.(\d+)/);
  if (!m) return null;
  const [, day, mon, year, h, min, s, ms] = m;
  const monthIndex = MONTHS[mon];
  if (monthIndex === undefined) return null; // unknown month → skip trade
  return new Date(Date.UTC(+year, monthIndex, +day, +h, +min, +s, +ms)).toISOString();
}

function parseNum(str) {
  return parseFloat(str.replace(/\s/g, ''));
}

function buildKey(symbol, closeTime, entryPrice, exitPrice) {
  return `${symbol}|${closeTime}|${entryPrice}|${exitPrice}`;
}

function parseCSVLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { inQuotes = !inQuotes; }
    else if (c === ',' && !inQuotes) { result.push(current.trim()); current = ''; }
    else { current += c; }
  }
  result.push(current.trim());
  return result;
}

function parseDDMMYYYYDate(str) {
  const m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{2}):(\d{2}):(\d{2})\.(\d+)/);
  if (!m) return null;
  const [, day, month, year, h, min, s, ms] = m;
  return new Date(Date.UTC(+year, +month - 1, +day, +h, +min, +s, +ms.slice(0, 3).padEnd(3, '0'))).toISOString();
}

function parseISODate(str) {
  const m = str.match(/^(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2}):(\d{2})/);
  if (!m) return null;
  const [, year, month, day, h, min, s] = m;
  return new Date(Date.UTC(+year, +month - 1, +day, +h, +min, +s)).toISOString();
}

function parseLegacyCSV(dataLines) {
  const trades = [];
  for (const line of dataLines) {
    const cols = line.split(',');
    if (cols.length < 8) continue;
    const symbol    = cols[0].trim();
    if (symbol !== 'XAUUSD') continue;
    const direction = cols[1].trim();
    const closeRaw  = cols[2].trim();
    const entryRaw  = cols[3].trim();
    const exitRaw   = cols[4].trim();
    const quantity  = cols[5].trim();
    const pips      = parseNum(cols[6].trim());
    const netUSD    = parseNum(cols[7].trim());
    const entryPrice = parseNum(entryRaw);
    const exitPrice  = parseNum(exitRaw);
    if (isNaN(entryPrice) || isNaN(exitPrice) || isNaN(pips)) continue;
    const closeTime = parseCTraderDate(closeRaw);
    if (!closeTime) continue;
    trades.push({ key: buildKey(symbol, closeTime, entryRaw, exitRaw), symbol, direction, closeTime, entryPrice, exitPrice, quantity, pips, netUSD, note: null });
  }
  return trades;
}

function parseCTraderExportCSV(dataLines) {
  const trades = [];
  for (const line of dataLines) {
    const cols = parseCSVLine(line);
    if (cols.length < 7) continue;
    const symbol = cols[0];
    if (symbol !== 'XAUUSD') continue;
    const direction  = cols[1];
    const closeRaw   = cols[2];
    const entryRaw   = cols[3];
    const exitRaw    = cols[4];
    const quantity   = cols[5];
    const pips       = parseFloat(cols[6]);
    const entryPrice = parseFloat(entryRaw);
    const exitPrice  = parseFloat(exitRaw);
    if (isNaN(entryPrice) || isNaN(exitPrice) || isNaN(pips)) continue;
    const closeTime = parseDDMMYYYYDate(closeRaw);
    if (!closeTime) continue;
    trades.push({ key: buildKey(symbol, closeTime, entryRaw, exitRaw), symbol, direction, closeTime, entryPrice, exitPrice, quantity, pips, netUSD: 0, note: null });
  }
  return trades;
}

function parseTradingJournalCSV(dataLines) {
  const trades = [];
  for (const line of dataLines) {
    const cols = parseCSVLine(line);
    if (cols.length < 14) continue;
    const symbol = cols[4];
    if (symbol !== 'XAUUSD') continue;
    const rawDir    = cols[2].toLowerCase();
    const direction = rawDir === 'buy' ? 'Buy' : rawDir === 'sell' ? 'Sell' : cols[2];
    const entryRaw  = cols[5];
    const exitRaw   = cols[9];
    const closeRaw  = cols[8];
    const quantity  = cols[3];
    const pips      = parseFloat(cols[13]);
    const entryPrice = parseFloat(entryRaw);
    const exitPrice  = parseFloat(exitRaw);
    if (isNaN(entryPrice) || isNaN(exitPrice) || isNaN(pips)) continue;
    const closeTime = parseISODate(closeRaw);
    if (!closeTime) continue;
    trades.push({ key: buildKey(symbol, closeTime, entryRaw, exitRaw), symbol, direction, closeTime, entryPrice, exitPrice, quantity, pips, netUSD: 0, note: null });
  }
  return trades;
}

function parseCSV(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  if (!lines.length) return [];

  if (lines[0] === 'Transactions') return parseLegacyCSV(lines.slice(2));

  const cols = parseCSVLine(lines[0]);

  if (cols[0] === 'Symbole' && cols[1] && cols[1].includes('ouverture')) return parseCTraderExportCSV(lines.slice(1));
  if (cols[0] === 'Ticket') return parseTradingJournalCSV(lines.slice(1));

  return [];
}

// ── pdf-parser.js ─────────────────────────────────────
async function parsePDFFile(file) {
  if (!window.pdfjsLib) throw new Error('PDF.js non chargé');
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

  const data = await file.arrayBuffer();
  const pdf  = await pdfjsLib.getDocument({ data }).promise;

  const allItems = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page    = await pdf.getPage(p);
    const content = await page.getTextContent();
    for (const item of content.items) {
      const text = item.str.replace(/[\u00A0\u202F\u2009]/g, ' ').trim();
      if (!text) continue;
      allItems.push({
        x: item.transform[4],
        y: (p - 1) * 1e6 - item.transform[5], // top-down across pages
        text
      });
    }
  }

  allItems.sort((a, b) => a.y - b.y || a.x - b.x);

  // Group items into rows by y tolerance of 3
  const rows = [];
  for (const item of allItems) {
    const last = rows[rows.length - 1];
    if (last && Math.abs(item.y - last.y) <= 3) {
      last.items.push(item);
    } else {
      rows.push({ y: item.y, items: [item] });
    }
  }

  // Approach 1: each y-row contains all fields of a trade (columns on same y)
  const trades = [];
  for (const row of rows) {
    row.items.sort((a, b) => a.x - b.x);
    const texts = row.items.map(i => i.text);
    if (texts[0] !== 'XAUUSD') continue;
    const line = texts.join(' ');
    const m = line.match(
      /^XAUUSD\s+(Vendre|Acheter|Buy|Sell)\s+(\d{1,2}\s+[A-Za-z\u00C0-\u024F]+\s+\d{4}\s+\d{2}:\d{2}:\d{2}\.\d+)\s+([\d.]+)\s+([\d.]+)\s+([\d.]+(?:\s+Lots)?)\s+(-?[\d.]+)(?:\s+(-?[\d\s.,]+))?$/
    );
    if (!m) continue;
    const [, direction, closeRaw, entryRaw, exitRaw, qtyRaw, pipsRaw, netUSDRaw] = m;
    const entryPrice = parseFloat(entryRaw);
    const exitPrice  = parseFloat(exitRaw);
    const pips       = parseFloat(pipsRaw);
    const netUSD     = netUSDRaw ? parseFloat(netUSDRaw.replace(/\s/g, '')) : 0;
    if (isNaN(entryPrice) || isNaN(exitPrice) || isNaN(pips)) continue;
    const closeTime = parseCTraderDate(closeRaw);
    if (!closeTime) continue;
    const key = buildKey('XAUUSD', closeTime, entryRaw, exitRaw);
    trades.push({ key, symbol: 'XAUUSD', direction, closeTime, entryPrice, exitPrice, quantity: qtyRaw.trim(), pips, netUSD, note: null });
  }
  if (trades.length > 0) return trades;

  // Approach 2: fields on separate y-rows (pdftotext-style) → chunk-based
  const chunks = [];
  for (const row of rows) {
    row.items.sort((a, b) => a.x - b.x);
    let chunk = '';
    let lastRight = -Infinity;
    for (const item of row.items) {
      if (chunk && item.x - lastRight > 40) {
        chunks.push(chunk.trim());
        chunk = item.text;
      } else {
        chunk += (chunk ? ' ' : '') + item.text;
      }
      lastRight = item.x + item.text.length * 6;
    }
    if (chunk.trim()) chunks.push(chunk.trim());
  }
  return parsePDFChunks(chunks);
}

function parsePDFChunks(chunks) {
  const trades = [];
  let i = 0;
  while (i < chunks.length) {
    if (chunks[i] !== 'XAUUSD' || i + 6 >= chunks.length) { i++; continue; }
    const direction = chunks[i + 1];
    if (!['Vendre', 'Acheter', 'Buy', 'Sell'].includes(direction)) { i++; continue; }
    const closeRaw = chunks[i + 2];
    const entryRaw = chunks[i + 3];
    const exitRaw  = chunks[i + 4];
    const quantity = chunks[i + 5];
    const chunk6   = chunks[i + 6];

    let pipsRaw, netUSDRaw, advance;
    // "99.86 4 988.12" — pips and netUSD in same chunk
    const combined = chunk6.match(/^(-?[\d.]+)\s+(-?[\d\s]+\.?\d+)$/);
    if (combined) {
      pipsRaw   = combined[1];
      netUSDRaw = combined[2].replace(/\s/g, '');
      advance   = 7;
    } else if (/^-?[\d.]+$/.test(chunk6)) {
      pipsRaw = chunk6;
      // Check if next chunk is a number (netUSD) or a new trade row
      if (i + 7 < chunks.length && /^-?[\d\s.,]+$/.test(chunks[i + 7])) {
        netUSDRaw = chunks[i + 7].replace(/\s/g, ''); advance = 8;
      } else {
        netUSDRaw = '0'; advance = 7;
      }
    } else { i++; continue; }

    const entryPrice = parseFloat(entryRaw);
    const exitPrice  = parseFloat(exitRaw);
    const pips       = parseFloat(pipsRaw);
    const netUSD     = parseFloat(netUSDRaw);
    if (isNaN(entryPrice) || isNaN(exitPrice) || isNaN(pips)) { i++; continue; }
    const closeTime = parseCTraderDate(closeRaw);
    if (!closeTime) { i++; continue; }
    const key = buildKey('XAUUSD', closeTime, entryRaw, exitRaw);
    trades.push({ key, symbol: 'XAUUSD', direction, closeTime, entryPrice, exitPrice, quantity, pips, netUSD, note: null });
    i += advance;
  }
  return trades;
}

// ── chart.js ──────────────────────────────────────────
function renderChart(container, trades) {
  const sorted = [...trades].sort(
    (a, b) => new Date(a.closeTime) - new Date(b.closeTime)
  );

  if (sorted.length === 0) {
    container.innerHTML = `
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;
                  height:100%;color:#8596a3;gap:6px;font-size:12px;">
        <span style="font-size:22px;">◫</span>
        <span>Importe un CSV pour voir ta courbe</span>
      </div>`;
    return;
  }

  const W = 600, H = 160;
  const PAD = { l: 46, r: 14, t: 12, b: 22 };

  let cum = 0;
  const pts = sorted.map(t => ({ date: new Date(t.closeTime), v: (cum += t.pips) }));

  const values = [0, ...pts.map(p => p.v)];
  let lo = Math.min(...values);
  let hi = Math.max(...values);
  if (hi === lo) { lo -= 10; hi += 10; }
  const mg = (hi - lo) * 0.12;
  lo -= mg; hi += mg;

  const minT = pts[0].date.getTime();
  const maxT = pts.at(-1).date.getTime();
  const tRange = maxT - minT || 1;

  const toX = t => PAD.l + (t.getTime() - minT) / tRange * (W - PAD.l - PAD.r);
  const toY = v => H - PAD.b - (v - lo) / (hi - lo) * (H - PAD.t - PAD.b);

  const coords = [[PAD.l, toY(0)], ...pts.map(p => [toX(p.date), toY(p.v)])];
  const d = coords.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');

  const total = cum;
  const color = total >= 0 ? '#287763' : '#b45555';
  const fill  = total >= 0 ? '#eaf3ef' : '#fdf0ef';

  const lx = coords.at(-1)[0].toFixed(1);
  const ly = coords.at(-1)[1].toFixed(1);
  const base = toY(0).toFixed(1);

  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block;">`;

  for (let i = 0; i <= 3; i++) {
    const v = lo + (hi - lo) * i / 3;
    const y = toY(v).toFixed(1);
    svg += `<line x1="${PAD.l}" y1="${y}" x2="${W - PAD.r}" y2="${y}" stroke="#e6edf1" ${i ? 'stroke-dasharray="3 5"' : ''}/>`;
    svg += `<text x="${PAD.l - 5}" y="${(+y + 3).toFixed(1)}" text-anchor="end" font-size="9" fill="#8596a3">${v.toFixed(0)}</text>`;
  }

  if (lo < 0 && hi > 0) {
    const y0 = toY(0).toFixed(1);
    svg += `<line x1="${PAD.l}" y1="${y0}" x2="${W - PAD.r}" y2="${y0}" stroke="#bcc8d0" stroke-width="0.75"/>`;
  }

  svg += `<path d="${d} L${lx},${base} L${PAD.l},${base} Z" fill="${fill}" opacity="0.65"/>`;
  svg += `<path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  svg += `<circle cx="${lx}" cy="${ly}" r="3.5" fill="${color}"/>`;
  svg += `</svg>`;

  container.innerHTML = svg;
}

// ── app.js ────────────────────────────────────────────
let selectedId = null; // account id | 'total' | 'dashboard'
let currentFilter = 'all'; // 'week' | 'month' | '3months' | 'all'

const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])
);

let toastTimer;
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 4000);
}

function fmtPips(v) {
  const n = Math.abs(v) < 1e-8 ? 0 : v;
  const s = new Intl.NumberFormat('fr-CA', { maximumFractionDigits: 1 }).format(n);
  return (n > 1e-8 ? '+' : '') + s;
}

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '—';
  return new Intl.DateTimeFormat('fr-CA', { day: 'numeric', month: 'short', year: 'numeric' }).format(d);
}

function totalPips(trades) {
  return trades.reduce((s, t) => s + t.pips, 0);
}

function monthPips(trades) {
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), 1);
  return trades
    .filter(t => new Date(t.closeTime) >= start)
    .reduce((s, t) => s + t.pips, 0);
}

function posClass(v) {
  return v > 1e-8 ? 'pos' : v < -1e-8 ? 'neg' : 'neutral';
}

function filterTrades(trades, filter) {
  if (filter === 'all') return trades;
  const now = new Date();
  let start;
  if (filter === 'week')    start = new Date(now - 7 * 86400000);
  if (filter === 'month')   start = new Date(now.getFullYear(), now.getMonth(), 1);
  if (filter === '3months') start = new Date(now.getFullYear(), now.getMonth() - 3, 1);
  return trades.filter(t => new Date(t.closeTime) >= start);
}

function getMonthlyBreakdown(trades) {
  const map = {};
  for (const t of trades) {
    const d = new Date(t.closeTime);
    const key = `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}`;
    if (!map[key]) map[key] = { pips: 0, count: 0, label: new Intl.DateTimeFormat('fr-CA', { month: 'short', year: 'numeric' }).format(d) };
    map[key].pips += t.pips;
    map[key].count++;
  }
  return Object.entries(map)
    .sort((a, b) => b[0].localeCompare(a[0]))
    .map(([, v]) => v);
}

          </div>`).join('')}
      </div>
    </div>` : ''}

    <div class="trades-panel">
      <div class="trades-panel-header">
        <span class="trades-panel-title">Trades</span>
        <div class="filter-tabs">
          <button class="filter-tab ${currentFilter === 'week'    ? 'active' : ''}" data-filter="week"    data-account="${esc(account.id)}">7 jours</button>
          <button class="filter-tab ${currentFilter === 'month'   ? 'active' : ''}" data-filter="month"   data-account="${esc(account.id)}">Mois</button>
          <button class="filter-tab ${currentFilter === '3months' ? 'active' : ''}" data-filter="3months" data-account="${esc(account.id)}">3 mois</button>
          <button class="filter-tab ${currentFilter === 'all'     ? 'active' : ''}" data-filter="all"     data-account="${esc(account.id)}">Tout</button>
        </div>
      </div>
      <div id="trade-list"></div>
    </div>

    <input type="file" id="file-input-csv" accept=".csv,text/csv" hidden>
    <input type="file" id="file-input-pdf" accept=".pdf,application/pdf" hidden>
  `;

  renderChart($('chart-container'), account.trades);
  if (account.trades.length) {
    const sorted = [...account.trades].sort((a, b) => new Date(a.closeTime) - new Date(b.closeTime));
    $('chart-dates').textContent = fmtDate(sorted[0].closeTime) + ' — ' + fmtDate(sorted.at(-1).closeTime);
  }

  renderTradeList(account);

  $('btn-import-csv').addEventListener('click', () => $('file-input-csv').click());
  $('file-input-csv').addEventListener('change', e => handleImport(e, account.id));
  $('btn-import-pdf').addEventListener('click', () => $('file-input-pdf').click());
  $('file-input-pdf').addEventListener('change', e => handleImport(e, account.id));
  $('btn-rename').addEventListener('click', () => openRenameDialog(account));
  $('btn-delete').addEventListener('click', () => handleDelete(account));
}

function renderTradeList(account) {
  const list = $('trade-list');
  const filtered = filterTrades(account.trades, currentFilter);
  const sorted = [...filtered].sort((a, b) => new Date(b.closeTime) - new Date(a.closeTime));

  if (!account.trades.length) {
    list.innerHTML = `<div style="padding:32px;text-align:center;color:var(--muted);font-size:12px;">
      Aucun trade. Importe un fichier pour commencer.
    </div>`;
    return;
  }

  if (!sorted.length) {
    list.innerHTML = `<div style="padding:32px;text-align:center;color:var(--muted);font-size:12px;">
      Aucun trade sur cette période.
    </div>`;
    return;
  }

  list.innerHTML = sorted.map(t => {
    const isPos = t.pips >= 0;
    const dirClass = (t.direction === 'Acheter' || t.direction === 'Buy') ? 'buy' : 'sell';
    const hasNote = t.note && (t.note.emotion || t.note.text);
    const noteLabel = hasNote ? (t.note.emotion ? t.note.emotion : '📝') : '+ Note';

    return `<div class="trade-row" data-key="${esc(t.key)}">
      <div class="trade-main">
        <span class="direction-badge ${dirClass}">${esc(t.direction)}</span>
        <span class="trade-date">${fmtDate(t.closeTime)}</span>
        <span class="trade-qty">${esc(t.quantity)}</span>
        <span class="trade-pips ${isPos ? 'pos' : 'neg'}">${fmtPips(t.pips)} pips</span>
        <button class="btn-note ${hasNote ? 'has-note' : ''}" data-note-key="${esc(t.key)}">${esc(noteLabel)}</button>
      </div>
      <div class="note-area" id="note-${esc(t.key)}">
        <div class="note-inner">
          <div class="note-row">
            <select class="emotion-select" data-emotion-key="${esc(t.key)}">
              <option value="">Émotion...</option>
              <option ${t.note?.emotion === 'Calme' ? 'selected' : ''}>Calme</option>
              <option ${t.note?.emotion === 'Confiant' ? 'selected' : ''}>Confiant</option>
              <option ${t.note?.emotion === 'Impatient' ? 'selected' : ''}>Impatient</option>
              <option ${t.note?.emotion === 'Stressé' ? 'selected' : ''}>Stressé</option>
              <option ${t.note?.emotion === 'Frustré' ? 'selected' : ''}>Frustré</option>
            </select>
            <textarea class="note-textarea" placeholder="Ce que je retiens de ce trade…" data-text-key="${esc(t.key)}" maxlength="1000">${esc(t.note?.text ?? '')}</textarea>
          </div>
          <button class="note-save-btn" data-save-key="${esc(t.key)}" data-account-id="${esc(account.id)}">Enregistrer</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderTotalView(state, main) {
  const allTrades = state.accounts.flatMap(a => a.trades);
  const total = totalPips(allTrades);
  const mth = monthPips(allTrades);
  const count = allTrades.length;

  const sorted = [...allTrades].sort((a, b) => new Date(a.closeTime) - new Date(b.closeTime));

  main.innerHTML = `
    <div class="account-header">
      <div>
        <h1>Total global</h1>
        <div class="account-meta">${state.accounts.length} compte${state.accounts.length !== 1 ? 's' : ''} · ${count} trade${count !== 1 ? 's' : ''}</div>
      </div>
      <div class="header-actions">
        <button class="btn-secondary btn-print" onclick="window.print()">↓ PDF</button>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total cumulé</div>
        <div class="stat-value ${posClass(total)}">${count ? fmtPips(total) : '—'}</div>
        <div class="stat-sub">pips nets (tous comptes)</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Ce mois-ci</div>
        <div class="stat-value ${posClass(mth)}">${count ? fmtPips(mth) : '—'}</div>
        <div class="stat-sub">pips nets</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Trades</div>
        <div class="stat-value neutral">${count}</div>
        <div class="stat-sub">positions clôturées</div>
      </div>
    </div>

    <div class="chart-card">
      <div class="chart-card-header">
        <span class="chart-card-title">Courbe cumulative — tous comptes</span>
        <span class="chart-dates" id="chart-dates"></span>
      </div>
      <div class="chart-container" id="chart-container"></div>
    </div>

    <div class="trades-panel">
      <div class="trades-panel-header">
        <span class="trades-panel-title">Répartition par compte</span>
      </div>
      <div style="padding:4px 0;">
        ${state.accounts.map(acc => {
          const t = totalPips(acc.trades);
          const isPos = t >= 0;
          return `<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);">
            <span style="font-size:13px;font-weight:600;color:var(--ink);">${esc(acc.name)}</span>
            <span style="font-size:14px;font-weight:700;color:${isPos ? 'var(--green)' : 'var(--red)'};">${acc.trades.length ? fmtPips(t) + ' pips' : '—'}</span>
          </div>`;
        }).join('')}
      </div>
    </div>
  `;

  renderChart($('chart-container'), allTrades);
  if (sorted.length) {
    $('chart-dates').textContent = fmtDate(sorted[0].closeTime) + ' — ' + fmtDate(sorted.at(-1).closeTime);
  }
}

function handleImport(e, accountId) {
  const file = e.target.files[0];
  if (!file) return;
  e.target.value = '';

  const finalize = trades => {
    if (!trades.length) { toast('Aucun trade XAUUSD trouvé dans ce fichier.'); return; }
    try {
      const { added, skipped } = addTrades(accountId, trades);
      const msg = `${added} trade${added !== 1 ? 's' : ''} ajouté${added !== 1 ? 's' : ''}${skipped ? `, ${skipped} doublon${skipped !== 1 ? 's' : ''} ignoré${skipped !== 1 ? 's' : ''}` : ''}.`;
      toast(msg);
      navigate(accountId);
    } catch (err) { toast(err.message); }
  };

  if (file.name.toLowerCase().endsWith('.pdf')) {
    parsePDFFile(file).then(finalize).catch(err => {
      console.error('PDF parse error:', err);
      toast('Fichier PDF invalide ou format non reconnu.');
    });
    return;
  }

  const reader = new FileReader();
  reader.onload = ev => {
    let trades;
    try { trades = parseCSV(ev.target.result); }
    catch { toast('Fichier CSV invalide ou format non reconnu.'); return; }
    finalize(trades);
  };
  reader.readAsText(file, 'utf-8');
}

function openAddAccountDialog() {
  const dialog = $('account-dialog');
  $('dialog-title').textContent = 'Nouveau compte';
  $('dialog-input').value = '';
  $('dialog-confirm').textContent = 'Créer';
  $('dialog-confirm').onclick = () => {
    const name = $('dialog-input').value.trim();
    if (!name) return;
    try {
      const acc = createAccount(name);
      dialog.close();
      navigate(acc.id);
      toast('Compte créé.');
    } catch (err) {
      toast(err.message);
    }
  };
  dialog.showModal();
}

function openRenameDialog(account) {
  const dialog = $('account-dialog');
  $('dialog-title').textContent = 'Renommer le compte';
  $('dialog-input').value = account.name;
  $('dialog-confirm').textContent = 'Renommer';
  $('dialog-confirm').onclick = () => {
    const name = $('dialog-input').value.trim();
    if (!name) return;
    try {
      renameAccount(account.id, name);
      dialog.close();
      navigate(account.id);
      toast('Compte renommé.');
    } catch (err) {
      toast(err.message);
    }
  };
  dialog.showModal();
}

function handleDelete(account) {
  if (!confirm(`Supprimer "${account.name}" et tous ses trades ?`)) return;
  try {
    deleteAccount(account.id);
    const state = loadState();
    selectedId = state.accounts.length ? state.accounts[0].id : null;
    renderSidebar();
    renderMain();
    toast('Compte supprimé.');
  } catch (err) {
    toast(err.message);
  }
}

// ── Backup ────────────────────────────────────────────
function exportBackup() {
  const json = JSON.stringify(loadState(), null, 2);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  a.download = `pips-backup-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
}

function importBackup(e) {
  const file = e.target.files[0];
  if (!file) return;
  e.target.value = '';
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.version !== 1 || !Array.isArray(data.accounts)) {
        toast('Fichier de sauvegarde invalide.');
        return;
      }
      saveState(data);
      selectedId = 'dashboard';
      renderSidebar();
      renderMain();
      toast('Sauvegarde restaurée.');
    } catch { toast('Impossible de lire ce fichier.'); }
  };
  reader.readAsText(file, 'utf-8');
}

$('btn-export-backup').addEventListener('click', exportBackup);
$('import-backup-input').addEventListener('change', importBackup);

$('brand-btn').addEventListener('click', () => navigate('dashboard'));
$('btn-add-account').addEventListener('click', openAddAccountDialog);
$('btn-total').addEventListener('click', () => navigate('total'));

$('account-list').addEventListener('click', e => {
  const btn = e.target.closest('[data-id]');
  if (btn) navigate(btn.dataset.id);
});

$('dialog-cancel').addEventListener('click', () => {
  $('account-dialog').close();
});

$('account-dialog').addEventListener('keydown', e => {
  if (e.key === 'Enter') $('dialog-confirm').click();
});

$('main').addEventListener('click', e => {
  const filterBtn = e.target.closest('[data-filter]');
  if (filterBtn) {
    currentFilter = filterBtn.dataset.filter;
    const acc = loadState().accounts.find(a => a.id === filterBtn.dataset.account);
    if (acc) renderAccountView(acc, $('main'));
    return;
  }

  const noteBtn = e.target.closest('[data-note-key]');
  if (noteBtn) {
    const key = noteBtn.dataset.noteKey;
    const area = document.getElementById('note-' + key);
    if (area) area.classList.toggle('open');
    return;
  }

  const saveBtn = e.target.closest('[data-save-key]');
  if (saveBtn) {
    const key = saveBtn.dataset.saveKey;
    const accId = saveBtn.dataset.accountId;
    const list = $('trade-list');
    if (!list) return;
    const emotion = list.querySelector(`[data-emotion-key="${CSS.escape(key)}"]`)?.value ?? '';
    const text = list.querySelector(`[data-text-key="${CSS.escape(key)}"]`)?.value?.trim() ?? '';
    try {
      saveNote(accId, key, { emotion, text });
      toast('Note enregistrée.');
      renderSidebar();
      const btn = list.querySelector(`[data-note-key="${CSS.escape(key)}"]`);
      if (btn) {
        const hasNote = emotion || text;
        btn.className = `btn-note ${hasNote ? 'has-note' : ''}`;
        btn.textContent = hasNote ? (emotion || '📝') : '+ Note';
      }
    } catch (err) {
      toast(err.message);
    }
  }
});

(function init() {
  selectedId = 'dashboard';
  renderSidebar();
  renderMain();
})();
</script>
</body>
</html>
