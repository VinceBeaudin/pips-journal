<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142939">
  <title>Pips — Journal XAUUSD</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand" id="brand-btn">pips<span class="brand-dot">.</span></div>
    <div class="sidebar-label">Mes comptes</div>
    <div class="account-list" id="account-list">
      <!-- Rendered by app.js -->
    </div>
    <button class="btn-add-account" id="btn-add-account">+ Nouveau compte</button>
    <div class="sidebar-total">
      <button class="total-btn" id="btn-total">
        <span class="total-label">Total global</span>
        <span class="total-value" id="sidebar-total-value">—</span>
        <span class="total-sub">pips cumulés</span>
      </button>
      <div class="sidebar-backup">
        <button id="btn-export-backup">↓ Backup</button>
        <label for="import-backup-input">↑ Restaurer<input type="file" id="import-backup-input" accept=".json" hidden></label>
      </div>
    </div>
  </aside>

  <!-- Main content -->
  <main class="main" id="main">
    <!-- Rendered by app.js -->
  </main>

</div>

<!-- Toast notification -->
<div id="toast" hidden></div>

<!-- Dialog: account name -->
<dialog id="account-dialog">
  <p class="dialog-title" id="dialog-title">Nouveau compte</p>
  <input class="dialog-input" id="dialog-input" type="text" placeholder="Nom du compte" maxlength="60">
  <div class="dialog-actions">
    <button class="btn-secondary" id="dialog-cancel">Annuler</button>
    <button class="btn-primary" id="dialog-confirm">Créer</button>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
